<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · TDK Project Tracker</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #f1f5f9; color: #0f172a; padding: 24px;
      }
      @media (prefers-color-scheme: dark) { body { background: #0b1220; color: #e2e8f0; } }
      .card { max-width: 380px; text-align: center; }
      .logo {
        width: 56px; height: 56px; border-radius: 14px; background: #1d4ed8; color: #fff;
        display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 24px;
        margin-bottom: 16px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #64748b; margin: 0 0 20px; line-height: 1.5; }
      button {
        border: 0; background: #1d4ed8; color: #fff; padding: 10px 20px; border-radius: 8px;
        font-size: 14px; font-weight: 500; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">T</div>
      <h1>You're offline</h1>
      <p>The TDK Project Tracker can't reach the network right now. Check your connection and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
